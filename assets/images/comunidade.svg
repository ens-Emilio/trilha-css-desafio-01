    <path d="M230 386 l-12 -16 M230 386 l12 -16 M230 386 v-20"/>
    <path d="M330 390 l-12 -16 M330 390 l12 -16 M330 390 v-20"/>
    <path d="M430 388 l-12 -16 M430 388 l12 -16 M430 388 v-20"/>
    <path d="M520 392 l-12 -16 M520 392 l12 -16 M520 392 v-20"/>

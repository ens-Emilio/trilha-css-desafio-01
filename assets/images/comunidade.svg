    <circle cx="561" cy="238" r="38" fill="#4a8c3f"/>
    <circle cx="534" cy="252" r="26" fill="#5da34c"/>
    <circle cx="588" cy="250" r="24" fill="#5da34c"/>
    <rect x="418" y="268" width="8" height="34" fill="#7a5230"/>
    <circle cx="422" cy="256" r="28" fill="#4a8c3f"/>
    <circle cx="402" cy="266" r="19" fill="#5da34c"/>

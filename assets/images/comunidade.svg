  </g>

  <!-- regador -->
  <g transform="translate(540,300)">
    <path d="M0 0 h34 v40 h-34 Z" fill="#7fb3d5"/>
    <path d="M34 10 L54 -4 L58 4 L34 22 Z" fill="#7fb3d5"/>
    <path d="M10 -6 q12 -12 24 0" fill="none" stroke="#5a8fb0" stroke-width="4"/>

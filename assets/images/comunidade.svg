  <g transform="translate(150,236)">
    <circle cx="26" cy="26" r="19" fill="#c98a5c"/>
    <path d="M6 22 Q26 0 46 22 L46 30 Q26 16 6 30 Z" fill="#3d2a17"/>
    <path d="M6 46 Q26 36 46 46 L52 118 Q26 128 0 118 Z" fill="#4ade80"/>

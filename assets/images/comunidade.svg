    <rect x="-10" y="34" width="20" height="34" fill="#8a5a34"/>
    <rect x="16" y="32" width="12" height="12" fill="#7fb3d5"/>
    <rect x="34" y="-30" width="11" height="26" fill="#8a8a8a"/>

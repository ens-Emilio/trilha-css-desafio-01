    <path d="M4 24 Q26 2 48 24 L48 66 L38 66 L38 32 Q26 20 14 32 L14 66 L4 66 Z" fill="#7a4a2a"/>
    <path d="M6 46 Q26 36 46 46 L52 116 Q26 126 0 116 Z" fill="#f0fdf4"/>
    <path d="M6 46 Q26 36 46 46 L47 62 Q26 72 5 62 Z" fill="#4ade80"/>
    <path d="M4 108 L0 154 L16 154 L18 112 Z" fill="#2f4a1f"/>
    <path d="M48 108 L56 154 L40 154 L34 112 Z" fill="#2f4a1f"/>
    <path d="M6 56 L-20 86 L-10 98 L12 72 Z" fill="#f0fdf4"/>

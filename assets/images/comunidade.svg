<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 659 429" width="659" height="429" role="img"
     aria-label="Três pessoas plantando mudas juntas em uma horta comunitária, com uma casa ao fundo">
  <rect width="659" height="429" fill="#eaf7ea"/>
  <circle cx="520" cy="110" r="62" fill="#fbbf24" opacity="0.85"/>
  <circle cx="520" cy="110" r="94" fill="#fbbf24" opacity="0.18"/>

  <!-- nuvens -->
  <g fill="#ffffff" opacity="0.85">

  <!-- colinas -->
  <path d="M0 268 Q140 224 290 262 Q420 296 659 250 L659 429 L0 429 Z" fill="#b6dd9a"/>
  <path d="M0 316 Q180 280 380 312 Q520 336 659 306 L659 429 L0 429 Z" fill="#8fc46a"/>

  <!-- casa -->
  <g transform="translate(90,196)">
    <path d="M-42 22 L0 -20 L42 22 Z" fill="#c1553c"/>
